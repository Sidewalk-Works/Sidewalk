name: API

on:
  pull_request:
    paths:
      - "apps/api/**"
      - "scripts/**"
      - "Makefile"
      - ".github/workflows/api.yml"
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "scripts/**"
      - "Makefile"
      - ".github/workflows/api.yml"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.7.12"
          enable-cache: true
          cache-dependency-glob: "apps/api/uv.lock"

      - name: Install dependencies
        run: uv sync --frozen --extra dev
        working-directory: apps/api

      - name: Ruff check
        run: uv run ruff check src/ tests/
        working-directory: apps/api

      - name: Ruff format check
        run: uv run ruff format --check src/ tests/
        working-directory: apps/api

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.7.12"
          enable-cache: true
          cache-dependency-glob: "apps/api/uv.lock"

      - name: Install dependencies
        run: uv sync --frozen --extra dev
        working-directory: apps/api

      - name: Run type check
        run: uv run mypy src/
        working-directory: apps/api

  test-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sidewalk
          POSTGRES_PASSWORD: sidewalk
          POSTGRES_DB: sidewalk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://sidewalk:sidewalk@localhost:5432/sidewalk_test
      TEST_DATABASE_URL: postgresql+asyncpg://sidewalk:sidewalk@localhost:5432/sidewalk_test
      SECRET_KEY: ci-test-secret-key-not-for-production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.7.12"
          enable-cache: true
          cache-dependency-glob: "apps/api/uv.lock"

      - name: Install dependencies
        run: uv sync --frozen --extra dev
        working-directory: apps/api

      - name: Run migrations
        run: uv run alembic upgrade head
        working-directory: apps/api

      - name: Check migrations
        run: uv run alembic check
        working-directory: apps/api

      - name: Run tests with coverage
        run: uv run pytest --cov=src --cov-report=term --cov-report=xml --cov-fail-under=80
        working-directory: apps/api

      - name: Upload coverage XML
        uses: actions/upload-artifact@v4
        with:
          name: api-coverage-xml
          path: apps/api/coverage.xml

      - name: Coverage summary
        if: always()
        working-directory: apps/api
        run: |
          {
            echo "## API Coverage (PostgreSQL)"
            if [ -f coverage.xml ]; then
              python -c "import xml.etree.ElementTree as ET; r=ET.parse('coverage.xml').getroot(); print(f\"Line coverage: {float(r.attrib.get('line-rate',0))*100:.2f}%\")"
            else
              echo "coverage.xml not found"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  test-sqlite:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-test-secret-key-not-for-production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "apps/api/uv.lock"

      - name: Install dependencies
        run: uv sync --frozen --extra dev
        working-directory: apps/api

      - name: Run tests (SQLite)
        run: uv run pytest --cov=src --cov-fail-under=80
        working-directory: apps/api
